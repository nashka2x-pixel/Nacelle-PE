<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Zoom désactivé pour l'app tactile -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>Gestion des Nacelles</title>

  <link rel="icon" href="https://i.postimg.cc/HxGb6VCY/Design-sans-titre.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/HxGb6VCY/Design-sans-titre.jpg">
  <meta name="theme-color" content="#0b72e7">

  <style>
    :root{ --max: 13; }
    *{ box-sizing: border-box; margin:0; padding:0; }

    /* Sécurité tactile globale */
    html, body{ touch-action: manipulation; }

    body.app{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      background: url("https://i.postimg.cc/13n4X0XY/background-optimized.jpg") no-repeat center center fixed;
      background-size: cover;
      color: #0b253a;
      user-select: none;
      min-height: 100vh;
      display: flex; flex-direction: column; gap: 10px; padding: 10px;
      touch-action: manipulation; /* réduit les délais de clic */
    }

    /* Toolbar */
    .toolbar{
      max-width: 560px; width:100%; margin:0 auto;
      display:flex; align-items:center; gap:8px;
      flex-wrap: nowrap; /* sur une seule ligne */
    }
    .leftStack{
      display:flex; align-items:center; gap:8px;
      flex:0 0 auto; min-width:0; /* pas de largeur réservée */
    }
    .rightStack{
      display:flex; gap:8px; flex:1 1 auto; justify-content:flex-end; min-width:0;
    }

    /* Compteur style bouton — même gabarit que les boutons */
    .badge{
      font-size: 18px; font-weight:800;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,.65);
      box-shadow: 0 3px 8px rgba(0,0,0,.18);
      min-width: 132px; text-align:center; white-space:nowrap;
      height:44px; display:flex; align-items:center; justify-content:center;
    }

    .btn{
      font-size: 18px; padding: 10px 12px; border: none; border-radius: 12px;
      background:#0b72e7; color:#fff; box-shadow: 0 3px 8px rgba(0,0,0,.2);
      cursor:pointer; min-width: 132px; white-space:nowrap;
      height:44px; display:flex; align-items:center; justify-content:center;
    }
    .btn.secondary{ background:#0e3854; }
    .btn.reserve{ background:#2f9e44; } /* vert distinct */

    /* Couloir — gabarit “avant” */
    .corridor{ max-width: 560px; width:100%; margin:0 auto; flex:1; display:grid; gap:8px; grid-template-rows: repeat(5, 1fr); }
    .row{ display:grid; grid-template-columns: 1fr 68px; gap:8px; }

    .zone{
      position:relative;
      display:grid; grid-template-columns: 110px 1fr; align-items:center; gap:8px;
      padding:10px; border-radius:14px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 4px 12px rgba(0,0,0,.16);
      cursor:pointer; border: 2px solid rgba(0,0,0,.06);
      overflow:hidden; transition: opacity .2s ease;
    }
    .zone:active{ transform: scale(.99); }
    .zone.disabled{ opacity:.45; pointer-events:none; }

    /* Bloc gauche */
    .left{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; }
    .label-info{ font-size: 14px; opacity:.9; font-weight:600; }
    .rem{ font-weight:900; line-height:1; font-variant-numeric: tabular-nums; font-size: clamp(30px, 5.2vh, 46px); }

    /* Points centrés 4-5-4 */
    .dots{ display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; }
    .dots-row{ display:flex; justify-content:center; gap: 12px; }
    .dot{ width: clamp(26px, 4vh, 34px); height: clamp(26px, 4vh, 34px); border-radius:50%;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.15); }
    .dot.free{ background:#ff3333; }
    .dot.taken{ background:#555; }
    .dot.reserved-switch{ background:#34c759; } /* vert */
    .dot.reserved-pmr{ background:#3da5ff; }    /* bleu */

    /* Watermark (discret) */
    .watermark{
      position:absolute; right:14px; top:50%; transform: translateY(-50%);
      font-weight:900; font-size: clamp(46px, 9vh, 92px);
      color: rgba(200,0,0,.16); line-height:1; pointer-events:none; user-select:none;
    }

    .minus{
      border:none; border-radius:16px; background:#ff5757; color:#fff;
      font-weight:800; font-size: clamp(24px, 5vh, 40px); line-height:1;
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 4px 10px rgba(0,0,0,.2); cursor:pointer;
    }

    /* Modals */
    .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; padding:18px; z-index:50; }
    .modal{
      width: min(560px, 96vw); max-height: 90vh; overflow:auto;
      background:#fff; color:#0b253a; border-radius:16px; padding:18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .modal h2{ margin:0 0 12px; font-size:22px; }
    .modal .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
    .btn.light{ background:#e6eef7; color:#0b253a; }

    /* Paramètres – gros pavés + gros switch */
    .toggle-list{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
    .toggle-item{ display:flex; align-items:center; justify-content:space-between; padding:16px; border:1px solid rgba(0,0,0,.08); border-radius:12px; background:#f7fafc; font-size:18px; }
    .switch{ position:relative; display:inline-block; width:68px; height:38px; }
    .switch input{ opacity:0; width:0; height:0; }
    .slider{ position:absolute; cursor:pointer; inset:0; background:#cfd8e3; transition:.2s; border-radius:999px; }
    .slider:before{ position:absolute; content:""; height:30px; width:30px; left:4px; top:4px; background:#fff; transition:.2s; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,.25); }
    .switch input:checked + .slider{ background:#0b72e7; }
    .switch input:checked + .slider:before{ transform: translateX(30px); }

    /* Réserver – 2 gros boutons carrés + stepper géant centré */
    .reserve-choices{ display:flex; gap:12px; margin:10px 0 14px; }
    .pill{
      flex:1; display:flex; align-items:center; justify-content:center;
      height:110px; /* carré / gros */
      border:3px solid transparent; border-radius:18px;
      font-size:22px; font-weight:900; cursor:pointer; text-align:center;
      background:#eef3fb; color:#0b253a; transition:.15s;
      user-select:none;
    }
    .pill[data-type="switch"].active{ background:#d5f6df; border-color:#34c759; box-shadow: 0 0 0 4px rgba(52,199,89,.25) inset; }
    .pill[data-type="pmr"].active{ background:#d8eaff; border-color:#3da5ff; box-shadow: 0 0 0 4px rgba(61,165,255,.25) inset; }

    .stepperWrap{ display:flex; justify-content:center; margin-top:6px; }
    .stepper{ display:flex; align-items:center; gap:14px; }
    .stepper .bigBtn{
      font-size:28px; font-weight:900; width:72px; height:72px; border-radius:16px; border:none; cursor:pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,.15);
      user-select:none;
    }
    .bigMinus{ background:#ffd7d7; }
    .bigPlus{ background:#d5f6df; }
    .countDisplay{ min-width: 90px; text-align:center; font-size:36px; font-weight:900; }

    /* Footer signature (cursive douce, italique, "plume") */
    .signature{
      width:100%; text-align:center; font-size:16px; color:#0e3854;
      font-style: italic; font-weight: 600;
      margin:6px 0 2px; display:flex; align-items:center; justify-content:center; gap:8px;
      font-family: "Segoe Script", "Brush Script MT", "Lucida Handwriting", "Snell Roundhand", cursive;
      transform: skewX(-4deg);
    }
    .signature svg{ width:16px; height:16px; }

    /* Petits écrans : on autorise la 2e ligne si besoin */
    @media (max-width: 520px){
      .toolbar{ flex-wrap: wrap; }
      .rightStack{ width:100%; justify-content:space-between; }
      .toggle-list{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="app">
  <div class="toolbar">
    <!-- Le badge occupe la même “case” visuelle qu’un bouton -->
    <div class="leftStack">
      <span class="badge" id="summaryMini">-- / --</span>
    </div>
    <div class="rightStack">
      <button class="btn" id="resetBtn">🔄 Reset</button>
      <button class="btn secondary" id="settingsBtn">⚙️ Options</button>
      <button class="btn reserve" id="reserveBtn">🎟️ Réserver</button>
    </div>
  </div>

  <main class="corridor" id="corridor"></main>

  <div class="signature">
    By Edithe
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="#0e3854" d="M12 21s-6.716-4.373-9.33-7.117C.93 11.02 1.238 7.94 3.343 6.02 5.26 4.288 8.093 4.61 10 6.243c1.907-1.633 4.74-1.955 6.657-.223 2.105 1.92 2.413 5 .673 7.863C18.716 16.627 12 21 12 21z"/>
    </svg>
  </div>

  <!-- Modal Paramètres -->
  <div class="modal-backdrop" id="modalSettings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <h2 id="settingsTitle">Paramètres des nacelles</h2>
      <div class="toggle-list" id="toggleList"></div>
      <div class="actions">
        <button class="btn light" id="closeSettings">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Modal Réserver -->
  <div class="modal-backdrop" id="modalReserve" role="dialog" aria-modal="true" aria-labelledby="reserveTitle">
    <div class="modal">
      <h2 id="reserveTitle">Réserver pour la prochaine séance</h2>
      <div class="reserve-choices">
        <button class="pill active" data-type="switch">👶 Switch</button>
        <button class="pill" data-type="pmr">♿ PMR</button>
      </div>
      <div class="stepperWrap">
        <div class="stepper">
          <button class="bigBtn bigMinus" id="decBtn">−</button>
          <div class="countDisplay" id="reserveCount">1</div>
          <button class="bigBtn bigPlus" id="incBtn">+</button>
        </div>
      </div>
      <div class="actions">
        <button class="btn light" id="reserveCancel">Annuler</button>
        <button class="btn reserve" id="reserveConfirm">Réserver</button>
      </div>
    </div>
  </div>

  <script>
    const NACELLES = 5;
    const MAX = 13;

    let counts = Array(NACELLES).fill(0);

    // Persistance
    let disabled = (() => {
      try { const raw = localStorage.getItem('nacelles_disabled_v1'); return raw ? JSON.parse(raw) : Array(NACELLES).fill(false); }
      catch { return Array(NACELLES).fill(false); }
    })();
    let reservedActive = (() => {
      try { const raw = localStorage.getItem('reserved_active_v1'); return raw ? JSON.parse(raw) : Array(NACELLES).fill(0); }
      catch { return Array(NACELLES).fill(0); }
    })();
    let reservedNextSwitch = (() => {
      try { const raw = localStorage.getItem('reserved_next_switch_v1'); return raw ? JSON.parse(raw) : Array(NACELLES).fill(0); }
      catch { return Array(NACELLES).fill(0); }
    })();
    let reservedNextPMR = (() => {
      try { const raw = localStorage.getItem('reserved_next_pmr_v1'); return raw ? JSON.parse(raw) : Array(NACELLES).fill(0); }
      catch { return Array(NACELLES).fill(0); }
    })();

    const corridor = document.getElementById('corridor');
    const summaryMini = document.getElementById('summaryMini');

    // Construction UI nacelles
    for (let i=0;i<NACELLES;i++){
      const row = document.createElement('div');
      row.className = 'row';

      const zone = document.createElement('div');
      zone.className = 'zone';
      zone.dataset.index=i;

      const left=document.createElement('div');
      left.className='left';
      left.innerHTML=`<div class="label-info">Places restantes :</div><div class="rem" id="rem-${i}">${MAX}</div>`;

      const dots=document.createElement('div');
      dots.className='dots';
      dots.innerHTML=`
        <div class="dots-row">${'<div class="dot free"></div>'.repeat(4)}</div>
        <div class="dots-row">${'<div class="dot free"></div>'.repeat(5)}</div>
        <div class="dots-row">${'<div class="dot free"></div>'.repeat(4)}</div>
      `;

      const wm=document.createElement('div');
      wm.className='watermark';
      wm.textContent=i+1;

      zone.append(left,dots,wm);
      zone.addEventListener('click',()=>add(i));

      const minus=document.createElement('button');
      minus.className='minus'; minus.textContent='−';
      minus.addEventListener('click',(e)=>{e.stopPropagation();remove(i);});

      row.append(zone,minus);
      corridor.appendChild(row);
    }

    function saveDisabled(){ try { localStorage.setItem('nacelles_disabled_v1', JSON.stringify(disabled)); } catch{} }
    function saveReservedActive(){ try { localStorage.setItem('reserved_active_v1', JSON.stringify(reservedActive)); } catch{} }
    function saveReservedNext(){
      try{
        localStorage.setItem('reserved_next_switch_v1', JSON.stringify(reservedNextSwitch));
        localStorage.setItem('reserved_next_pmr_v1', JSON.stringify(reservedNextPMR));
      }catch{}
    }

    function updateSummary(){
      let cap=0, used=0;
      for(let i=0;i<NACELLES;i++){
        if(!disabled[i]){ cap += MAX; used += counts[i] + reservedActive[i]; }
      }
      summaryMini.textContent = `${cap - used} / ${cap}`;
    }

    function update(){
      for(let i=0;i<NACELLES;i++){
        const zone=corridor.querySelectorAll('.zone')[i];
        const rem=zone.querySelector('.rem');
        const dots=zone.querySelectorAll('.dot');

        if(disabled[i]){
          zone.classList.add('disabled');
          rem.textContent='—';
          dots.forEach(d=>d.className='dot taken');
          continue;
        } else zone.classList.remove('disabled');

        const c=counts[i];
        const r=reservedActive[i];
        const reste=Math.max(0, MAX - c - r);
        rem.textContent=reste;

        dots.forEach((d,j)=>{
          if(j<c){ d.className='dot taken'; }
          else if(j<c+r){
            if (i===4 || i===3) d.className='dot reserved-switch';
            else if (i===1) d.className='dot reserved-pmr';
            else d.className='dot reserved-switch';
          } else d.className='dot free';
        });
      }
      updateSummary();
    }

    function add(i){ if(!disabled[i] && counts[i] + reservedActive[i] < MAX){ counts[i]++; update(); } }
    function remove(i){ if(!disabled[i] && counts[i] > 0){ counts[i]--; update(); } }

    // Nouvelle séance : applique les réservations "next"
    function resetAll(){
      counts = Array(NACELLES).fill(0);
      reservedActive = Array(NACELLES).fill(0);
      for(let i=0;i<NACELLES;i++){
        reservedActive[i] = (reservedNextSwitch[i]||0) + (reservedNextPMR[i]||0);
      }
      reservedNextSwitch = Array(NACELLES).fill(0);
      reservedNextPMR = Array(NACELLES).fill(0);
      saveReservedActive(); saveReservedNext();
      update();
    }
    document.getElementById('resetBtn').addEventListener('click', resetAll);

    /* ----- Paramètres ----- */
    const modalSettings = document.getElementById('modalSettings');
    const settingsBtn = document.getElementById('settingsBtn');
    const closeSettings = document.getElementById('closeSettings');
    const toggleList = document.getElementById('toggleList');

    function renderSettings(){
      toggleList.innerHTML = '';
      for (let i=0; i<NACELLES; i++){
        const item = document.createElement('div');
        item.className = 'toggle-item';
        item.innerHTML = `
          <span>Nacelle ${i+1}</span>
          <label class="switch">
            <input type="checkbox" ${disabled[i] ? '' : 'checked'} data-i="${i}">
            <span class="slider"></span>
          </label>
        `;
        toggleList.appendChild(item);
      }
      toggleList.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
        cb.addEventListener('change', (e)=>{
          const idx = +e.target.dataset.i;
          disabled[idx] = !e.target.checked;   // checked = active
          saveDisabled();
          update();
        });
      });
    }
    function openSettings(){ renderSettings(); modalSettings.style.display='flex'; }
    function closeSettingsFn(){ modalSettings.style.display='none'; }
    settingsBtn.addEventListener('click', openSettings);
    closeSettings.addEventListener('click', closeSettingsFn);
    modalSettings.addEventListener('click', (e)=>{ if(e.target===modalSettings) closeSettingsFn(); });

    /* ----- Réserver ----- */
    const modalReserve = document.getElementById('modalReserve');
    const reserveBtn = document.getElementById('reserveBtn');
    const reserveCancel = document.getElementById('reserveCancel');
    const reserveConfirm = document.getElementById('reserveConfirm');
    const decBtn = document.getElementById('decBtn');
    const incBtn = document.getElementById('incBtn');
    const reserveCountDisplay = document.getElementById('reserveCount');
    let reserveType = 'switch';
    let reserveQty = 1;

    function openReserve(){
      reserveType = 'switch';
      reserveQty = 1;
      updateReserveCount();
      document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p.dataset.type==='switch'));
      modalReserve.style.display='flex';
    }
    function closeReserve(){ modalReserve.style.display='none'; }
    function updateReserveCount(){ reserveCountDisplay.textContent = String(reserveQty); }

    document.querySelectorAll('.pill').forEach(p=>{
      p.addEventListener('click',()=>{
        reserveType = p.dataset.type;
        document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
        p.classList.add('active');
      });
    });

    decBtn.addEventListener('click', ()=>{ reserveQty = Math.max(1, reserveQty-1); updateReserveCount(); });
    incBtn.addEventListener('click', ()=>{ reserveQty = Math.max(1, reserveQty+1); updateReserveCount(); });

    reserveBtn.addEventListener('click', openReserve);
    reserveCancel.addEventListener('click', closeReserve);
    modalReserve.addEventListener('click',(e)=>{ if(e.target===modalReserve) closeReserve(); });

    reserveConfirm.addEventListener('click', ()=>{
      const n = reserveQty;

      if(reserveType==='switch'){
        // cible 5 sinon 4
        let target = (!disabled[4]) ? 4 : ((!disabled[3]) ? 3 : -1);
        if (target !== -1) reservedNextSwitch[target] += n;
      } else {
        // PMR -> nacelle 2 (index 1)
        let target = 1;
        if (!disabled[target]) reservedNextPMR[target] += n;
      }
      saveReservedNext();
      closeReserve();
    });

    /* ----- Anti-zoom tactile (double-tap & pinch) ----- */
    let _lastTouchEnd = 0;
    document.addEventListener('touchend', function (e) {
      const now = Date.now();
      if (now - _lastTouchEnd <= 300) { e.preventDefault(); }
      _lastTouchEnd = now;
    }, { passive:false });
    document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
    document.addEventListener('gesturechange', e => e.preventDefault(), { passive:false });
    document.addEventListener('gestureend', e => e.preventDefault(), { passive:false });

    // Init affichage
    update();
  </script>
</body>
</html>
